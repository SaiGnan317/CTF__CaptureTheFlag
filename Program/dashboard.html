<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS CTF | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'], mono: ['Fira Code', 'monospace'] },
                    colors: { nexus: { black: '#0d0d0d', dark: '#151515', grey: '#2a2a2a', lightGrey: '#8e8e8e', white: '#f5f5f5', red: '#D2042D', purple: '#8A2BE2' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0d0d0d; color: #f5f5f5; }
        .gradient-text { background: linear-gradient(135deg, #8A2BE2, #D2042D); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .chal-card { background: #151515; border: 1px solid #2a2a2a; border-radius: 12px; transition: all 0.3s ease; position: relative; overflow: hidden; cursor: pointer; }
        .chal-card:hover { border-color: #8A2BE2; transform: translateY(-4px); box-shadow: 0 10px 30px rgba(138, 43, 226, 0.15); }
        .chal-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: #2a2a2a; transition: all 0.3s ease; }
        .chal-card:hover::before { background: linear-gradient(to bottom, #8A2BE2, #D2042D); }
        .chal-card.solved::before { background: #D2042D; }
        .chal-card.solved { border-color: rgba(210, 4, 45, 0.3); }
        .nav-link { position: relative; }
        .nav-link::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -4px; left: 0; background-color: #D2042D; transition: width 0.3s ease; }
        .nav-link:hover::after { width: 100%; }
    </style>
</head>
<body class="min-h-screen">
    <!-- Navigation Bar -->
    <nav class="bg-nexus-dark/80 backdrop-blur-md border-b border-nexus-grey p-4 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-8">
                <span class="font-extrabold text-2xl tracking-tighter gradient-text cursor-default">NEXUS_CTF</span>
                <div class="hidden md:flex gap-6">
                    <a href="/dashboard.html" class="nav-link text-nexus-white font-semibold text-sm tracking-widest uppercase">Dashboard</a>
                    <a href="/leaderboard.html" class="nav-link text-nexus-lightGrey hover:text-nexus-white font-semibold text-sm tracking-widest uppercase transition">Leaderboard</a>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-sm font-mono text-nexus-lightGrey mr-4 hidden md:block">Team: <span id="teamNameDisplay" class="text-nexus-white font-bold">...</span></div>
                <button id="logoutBtn" class="bg-nexus-grey hover:bg-nexus-red hover:text-white text-nexus-lightGrey px-5 py-2 rounded-lg text-sm font-bold transition duration-300">
                    LOGOUT
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-8 pt-12">
        <div class="mb-10 flex flex-col md:flex-row justify-between items-start md:items-end gap-6">
            <div>
                <h1 class="text-4xl font-extrabold mb-2">Available Nodes</h1>
                <p class="text-nexus-lightGrey font-medium">Select a challenge node to begin decryption.</p>
            </div>
            <div class="bg-nexus-black border border-nexus-grey p-4 rounded-lg flex flex-col items-start md:items-end w-full md:w-auto">
                <span class="text-xs text-nexus-lightGrey uppercase tracking-widest mb-2 flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 11V7a4 4 0 118 0m-4 8v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2z"></path></svg>
                    Team Token (Share to invite)
                </span>
                <div class="flex items-center gap-2 w-full">
                    <input type="text" id="teamTokenDisplay" readonly class="bg-nexus-dark text-nexus-purple font-mono font-bold px-3 py-2 rounded text-sm w-full md:w-64 border border-nexus-grey focus:outline-none selection:bg-nexus-purple/30">
                    <button onclick="copyToken()" class="bg-nexus-grey hover:bg-nexus-purple hover:text-white px-3 py-2 rounded transition text-xs font-bold tracking-widest">COPY</button>
                </div>
            </div>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="challengesGrid">
            <!-- Challenges injected via JS -->
        </div>
    </main>

    <script>
        const challenges = [
            { id: 1, title: 'The Hidden Header', category: 'Web Security', points: 100 },
            { id: 2, title: 'The Caesar\'s Shifted Cipher', category: 'Cryptography', points: 100 },
            { id: 3, title: 'The Bytecode Vault', category: 'Reverse Engineering', points: 150 },
            { id: 4, title: 'The Corrupted Archive', category: 'Forensics', points: 200 }
        ];

        async function init() {
            try {
                let token = localStorage.getItem('team_token');
                if(!token) {
                    // Try to extract from cookie if localStorage is empty
                    const match = document.cookie.match(/(?:^|; )team_token=([^;]+)/);
                    if(match) token = match[1];
                }

                const meRes = await fetch('/api/me', {
                    headers: token ? { 'Authorization': token } : {}
                });
                if (!meRes.ok) throw new Error('Not logged in');
                const meData = await meRes.json();
                document.getElementById('teamNameDisplay').textContent = meData.team.name;
                document.getElementById('teamTokenDisplay').value = meData.team.token;

                window.copyToken = function() {
                    const tokenInput = document.getElementById('teamTokenDisplay');
                    tokenInput.select();
                    document.execCommand('copy');
                    alert('Token copied to clipboard!');
                };

                const chalRes = await fetch('/api/challenges', {
                    headers: token ? { 'Authorization': token } : {}
                });
                const chalData = await chalRes.json();
                const statusMap = {};
                chalData.challenges.forEach(c => {
                    statusMap[c.challenge_id] = c;
                });

                const grid = document.getElementById('challengesGrid');
                challenges.forEach(c => {
                    const status = statusMap[c.id];
                    const isSolved = status && status.solved;
                    
                    let badgeColor = 'bg-nexus-grey text-nexus-lightGrey';
                    let statusText = 'UNATTEMPTED';
                    
                    if (isSolved) {
                        badgeColor = 'bg-nexus-red/20 text-nexus-red border border-nexus-red/30';
                        statusText = 'SOLVED';
                    } else if (status) {
                        badgeColor = 'bg-nexus-purple/20 text-nexus-purple border border-nexus-purple/30';
                        statusText = 'IN_PROGRESS';
                    }

                    const card = document.createElement('div');
                    card.className = `chal-card p-8 ${isSolved ? 'solved' : ''}`;
                    card.onclick = () => window.location.href = `/challenge.html?id=${c.id}`;
                    card.innerHTML = `
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <h3 class="text-2xl font-bold text-nexus-white mb-2">${c.title}</h3>
                                <span class="text-xs font-mono tracking-widest text-nexus-lightGrey uppercase">${c.category}</span>
                            </div>
                            <span class="text-lg font-bold gradient-text">${c.points} pt</span>
                        </div>
                        <div class="mt-8 pt-4 border-t border-nexus-grey flex justify-between items-center">
                            <span class="px-3 py-1 rounded text-xs font-bold tracking-widest ${badgeColor}">${statusText}</span>
                            <span class="text-sm font-semibold text-nexus-white opacity-0 transition-opacity group-hover:opacity-100 flex items-center gap-1">
                                ENTER NODE <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

            } catch (err) {
                console.error(err);
                window.location.href = '/';
            }
        }

        document.getElementById('logoutBtn').addEventListener('click', () => {
            document.cookie = 'team_token=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;';
            localStorage.removeItem('team_token');
            window.location.href = '/';
        });

        init();
    </script>
</body>
</html>
